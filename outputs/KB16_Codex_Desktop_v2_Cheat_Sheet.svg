<svg xmlns="http://www.w3.org/2000/svg" width="11in" height="8.5in" viewBox="0 0 1650 1275" role="img" aria-labelledby="title description">
  <title id="title">KB16 Codex Desktop pure VIA v2 cheat sheet</title>
  <desc id="description">Four layer maps and three encoder assignments for the yellow DOIO KB16 macropad.</desc>
  <defs>
    <style>
      .page { fill: #0a0b0d; }
      .panel { fill: #e8a11a; stroke: #ffc247; stroke-width: 3; }
      .key { fill: #17191d; stroke: #363a41; stroke-width: 2; }
      .key-accent { fill: #152d33; stroke: #36e9f5; stroke-width: 2; }
      .mode { font: 800 27px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #111317; letter-spacing: 1px; }
      .display { font: 800 31px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #36e9f5; }
      .label { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7f4ed; text-anchor: middle; }
      .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #aeb5be; text-anchor: middle; }
      .header { font: 900 46px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7f4ed; letter-spacing: 1px; }
      .subhead { font: 500 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #aeb5be; }
      .knob-title { font: 800 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #36e9f5; }
      .knob-text { font: 650 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f7f4ed; }
      .hint { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #6f3d00; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect class="page" width="1650" height="1275"/>
  <text class="header" x="45" y="63">KB16 × CODEX</text>
  <text class="subhead" x="45" y="94">PURE VIA v2 · OLED 1–4 · macOS · cyan keys change mode or expose a held layer</text>

  <!-- OLED 1: CHAT -->
  <g transform="translate(35 120)" filter="url(#shadow)">
    <rect class="panel" width="780" height="445" rx="30"/>
    <rect x="28" y="28" width="74" height="54" rx="10" fill="#111317"/>
    <text class="display" x="65" y="65" text-anchor="middle">1</text>
    <text class="mode" x="120" y="64">CHAT</text>
    <text class="hint" x="28" y="112">DEFAULT</text>

    <g transform="translate(142 96)">
      <rect class="key" x="0" y="0" width="145" height="74" rx="12"/><text class="label" x="72" y="34">NEW CHAT</text>
      <rect class="key" x="151" y="0" width="145" height="74" rx="12"/><text class="label" x="223" y="34">SEARCH</text>
      <rect class="key" x="302" y="0" width="145" height="74" rx="12"/><text class="label" x="374" y="34">QUICK CHAT</text>
      <rect class="key" x="453" y="0" width="145" height="74" rx="12"/><text class="label" x="525" y="27"><tspan x="525">COMMAND</tspan><tspan class="small" x="525" dy="21">MENU</tspan></text>

      <rect class="key" x="0" y="80" width="145" height="74" rx="12"/><text class="label" x="72" y="114">DICTATE</text>
      <rect class="key" x="151" y="80" width="145" height="74" rx="12"/><text class="label" x="223" y="107"><tspan x="223">LIVE</tspan><tspan class="small" x="223" dy="21">VOICE</tspan></text>
      <rect class="key" x="302" y="80" width="145" height="74" rx="12"/><text class="label" x="374" y="114">SEND</text>
      <rect class="key" x="453" y="80" width="145" height="74" rx="12"/><text class="label" x="525" y="107"><tspan x="525">ESC</tspan><tspan class="small" x="525" dy="21">STOP</tspan></text>

      <rect class="key" x="0" y="160" width="145" height="74" rx="12"/><text class="label" x="72" y="194">SIDEBAR</text>
      <rect class="key" x="151" y="160" width="145" height="74" rx="12"/><text class="label" x="223" y="187"><tspan x="223">OPEN</tspan><tspan class="small" x="223" dy="21">FOLDER</tspan></text>
      <rect class="key" x="302" y="160" width="145" height="74" rx="12"/><text class="label" x="374" y="194">REVIEW</text>
      <rect class="key" x="453" y="160" width="145" height="74" rx="12"/><text class="label" x="525" y="194">TERMINAL</text>

      <rect class="key-accent" x="0" y="240" width="145" height="74" rx="12"/><text class="label" x="72" y="267"><tspan x="72">HOLD</tspan><tspan class="small" x="72" dy="21">WORK</tspan></text>
      <rect class="key-accent" x="151" y="240" width="145" height="74" rx="12"/><text class="label" x="223" y="274">CONTROL</text>
      <rect class="key-accent" x="302" y="240" width="145" height="74" rx="12"/><text class="label" x="374" y="274">REVIEW</text>
      <rect class="key" x="453" y="240" width="145" height="74" rx="12"/><text class="label" x="525" y="267"><tspan x="525">MODEL</tspan><tspan class="small" x="525" dy="21">PICKER</tspan></text>
    </g>
  </g>

  <!-- OLED 2: CONTROL -->
  <g transform="translate(835 120)" filter="url(#shadow)">
    <rect class="panel" width="780" height="445" rx="30"/>
    <rect x="28" y="28" width="74" height="54" rx="10" fill="#111317"/>
    <text class="display" x="65" y="65" text-anchor="middle">2</text>
    <text class="mode" x="120" y="64">CONTROL</text>
    <text class="hint" x="28" y="112">PERSISTENT</text>

    <g transform="translate(142 96)">
      <rect class="key" x="0" y="0" width="145" height="74" rx="12"/><text class="label" x="72" y="34">EFFORT −</text>
      <rect class="key" x="151" y="0" width="145" height="74" rx="12"/><text class="label" x="223" y="34">EFFORT +</text>
      <rect class="key" x="302" y="0" width="145" height="74" rx="12"/><text class="label" x="374" y="27"><tspan x="374">MODEL</tspan><tspan class="small" x="374" dy="21">PICKER</tspan></text>
      <rect class="key" x="453" y="0" width="145" height="74" rx="12"/><text class="label" x="525" y="27"><tspan x="525">PLAN</tspan><tspan class="small" x="525" dy="21">MODE</tspan></text>

      <rect class="key" x="0" y="80" width="145" height="74" rx="12"/><text class="label" x="72" y="107"><tspan x="72">FAST</tspan><tspan class="small" x="72" dy="21">MODE</tspan></text>
      <rect class="key" x="151" y="80" width="145" height="74" rx="12"/><text class="label" x="223" y="107"><tspan x="223">ATTACH</tspan><tspan class="small" x="223" dy="21">FILES</tspan></text>
      <rect class="key" x="302" y="80" width="145" height="74" rx="12"/><text class="label" x="374" y="114">APPROVE</text>
      <rect class="key" x="453" y="80" width="145" height="74" rx="12"/><text class="label" x="525" y="114">DECLINE</text>

      <rect class="key" x="0" y="160" width="145" height="74" rx="12"/><text class="label" x="72" y="187"><tspan x="72">PROJECT</tspan><tspan class="small" x="72" dy="21">PICKER</tspan></text>
      <rect class="key" x="151" y="160" width="145" height="74" rx="12"/><text class="label" x="223" y="187"><tspan x="223">COPY AS</tspan><tspan class="small" x="223" dy="21">MARKDOWN</tspan></text>
      <rect class="key" x="302" y="160" width="145" height="74" rx="12"/><text class="label" x="374" y="187"><tspan x="374">SIDE</tspan><tspan class="small" x="374" dy="21">CHAT</tspan></text>
      <rect class="key" x="453" y="160" width="145" height="74" rx="12"/><text class="label" x="525" y="187"><tspan x="525">CONTINUE</tspan><tspan class="small" x="525" dy="21">NEW CHAT</tspan></text>

      <rect class="key-accent" x="0" y="240" width="145" height="74" rx="12"/><text class="label" x="72" y="267"><tspan x="72">HOLD</tspan><tspan class="small" x="72" dy="21">WORK</tspan></text>
      <rect class="key-accent" x="151" y="240" width="145" height="74" rx="12"/><text class="label" x="223" y="274">CHAT</text>
      <rect class="key-accent" x="302" y="240" width="145" height="74" rx="12"/><text class="label" x="374" y="274">REVIEW</text>
      <rect class="key" x="453" y="240" width="145" height="74" rx="12"/><text class="label" x="525" y="274">ESC / STOP</text>
    </g>
  </g>

  <!-- OLED 3: REVIEW -->
  <g transform="translate(35 585)" filter="url(#shadow)">
    <rect class="panel" width="780" height="445" rx="30"/>
    <rect x="28" y="28" width="74" height="54" rx="10" fill="#111317"/>
    <text class="display" x="65" y="65" text-anchor="middle">3</text>
    <text class="mode" x="120" y="64">REVIEW</text>
    <text class="hint" x="28" y="112">PERSISTENT</text>

    <g transform="translate(142 96)">
      <rect class="key" x="0" y="0" width="145" height="74" rx="12"/><text class="label" x="72" y="27"><tspan x="72">OPEN</tspan><tspan class="small" x="72" dy="21">REVIEW</tspan></text>
      <rect class="key" x="151" y="0" width="145" height="74" rx="12"/><text class="label" x="223" y="27"><tspan x="223">TOGGLE</tspan><tspan class="small" x="223" dy="21">PANEL</tspan></text>
      <rect class="key" x="302" y="0" width="145" height="74" rx="12"/><text class="label" x="374" y="34">APPROVE</text>
      <rect class="key" x="453" y="0" width="145" height="74" rx="12"/><text class="label" x="525" y="34">DECLINE</text>

      <rect class="key" x="0" y="80" width="145" height="74" rx="12"/><text class="label" x="72" y="107"><tspan x="72">PREVIOUS</tspan><tspan class="small" x="72" dy="21">CHAT</tspan></text>
      <rect class="key" x="151" y="80" width="145" height="74" rx="12"/><text class="label" x="223" y="107"><tspan x="223">NEXT</tspan><tspan class="small" x="223" dy="21">CHAT</tspan></text>
      <rect class="key" x="302" y="80" width="145" height="74" rx="12"/><text class="label" x="374" y="107"><tspan x="374">COPY AS</tspan><tspan class="small" x="374" dy="21">MARKDOWN</tspan></text>
      <rect class="key" x="453" y="80" width="145" height="74" rx="12"/><text class="label" x="525" y="107"><tspan x="525">CONTINUE</tspan><tspan class="small" x="525" dy="21">NEW CHAT</tspan></text>

      <rect class="key" x="0" y="160" width="145" height="74" rx="12"/><text class="label" x="72" y="194">COPY</text>
      <rect class="key" x="151" y="160" width="145" height="74" rx="12"/><text class="label" x="223" y="187"><tspan x="223">FIND IN</tspan><tspan class="small" x="223" dy="21">CHAT</tspan></text>
      <rect class="key" x="302" y="160" width="145" height="74" rx="12"/><text class="label" x="374" y="194">TERMINAL</text>
      <rect class="key" x="453" y="160" width="145" height="74" rx="12"/><text class="label" x="525" y="187"><tspan x="525">COMMAND</tspan><tspan class="small" x="525" dy="21">MENU</tspan></text>

      <rect class="key-accent" x="0" y="240" width="145" height="74" rx="12"/><text class="label" x="72" y="267"><tspan x="72">HOLD</tspan><tspan class="small" x="72" dy="21">WORK</tspan></text>
      <rect class="key-accent" x="151" y="240" width="145" height="74" rx="12"/><text class="label" x="223" y="274">CHAT</text>
      <rect class="key-accent" x="302" y="240" width="145" height="74" rx="12"/><text class="label" x="374" y="274">CONTROL</text>
      <rect class="key" x="453" y="240" width="145" height="74" rx="12"/><text class="label" x="525" y="274">ESC / STOP</text>
    </g>
  </g>

  <!-- OLED 4: WORK -->
  <g transform="translate(835 585)" filter="url(#shadow)">
    <rect class="panel" width="780" height="445" rx="30"/>
    <rect x="28" y="28" width="74" height="54" rx="10" fill="#111317"/>
    <text class="display" x="65" y="65" text-anchor="middle">4</text>
    <text class="mode" x="120" y="64">WORK</text>
    <text class="hint" x="28" y="112">HOLD</text>

    <g transform="translate(142 96)">
      <rect class="key" x="0" y="0" width="145" height="74" rx="12"/><text class="label" x="72" y="34">SUMMARIZE</text>
      <rect class="key" x="151" y="0" width="145" height="74" rx="12"/><text class="label" x="223" y="34">IMPLEMENT</text>
      <rect class="key" x="302" y="0" width="145" height="74" rx="12"/><text class="label" x="374" y="27"><tspan x="374">REVIEW</tspan><tspan class="small" x="374" dy="21">ONLY</tspan></text>
      <rect class="key" x="453" y="0" width="145" height="74" rx="12"/><text class="label" x="525" y="34">EXPLAIN</text>

      <rect class="key" x="0" y="80" width="145" height="74" rx="12"/><text class="label" x="72" y="107"><tspan x="72">DIAGNOSE</tspan><tspan class="small" x="72" dy="21">ONLY</tspan></text>
      <rect class="key" x="151" y="80" width="145" height="74" rx="12"/><text class="label" x="223" y="114">VERIFY</text>
      <rect class="key" x="302" y="80" width="145" height="74" rx="12"/><text class="label" x="374" y="107"><tspan x="374">UPDATE</tspan><tspan class="small" x="374" dy="21">DOCS</tspan></text>
      <rect class="key" x="453" y="80" width="145" height="74" rx="12"/><text class="label" x="525" y="107"><tspan x="525">PLAN</tspan><tspan class="small" x="525" dy="21">FIRST</tspan></text>

      <rect class="key" x="0" y="160" width="145" height="74" rx="12"/><text class="label" x="72" y="194">COPY</text>
      <rect class="key" x="151" y="160" width="145" height="74" rx="12"/><text class="label" x="223" y="194">PASTE</text>
      <rect class="key" x="302" y="160" width="145" height="74" rx="12"/><text class="label" x="374" y="194">UNDO</text>
      <rect class="key" x="453" y="160" width="145" height="74" rx="12"/><text class="label" x="525" y="194">REDO</text>

      <rect class="key-accent" x="0" y="240" width="145" height="74" rx="12"/><text class="label" x="72" y="267"><tspan x="72">HOLD /</tspan><tspan class="small" x="72" dy="21">RELEASE</tspan></text>
      <rect class="key-accent" x="151" y="240" width="145" height="74" rx="12"/><text class="label" x="223" y="274">CHAT</text>
      <rect class="key-accent" x="302" y="240" width="145" height="74" rx="12"/><text class="label" x="374" y="274">CONTROL</text>
      <rect class="key-accent" x="453" y="240" width="145" height="74" rx="12"/><text class="label" x="525" y="274">REVIEW</text>
    </g>
  </g>

  <!-- Shared encoder rail -->
  <g transform="translate(35 1055)">
    <rect x="0" y="0" width="1580" height="172" rx="26" fill="#14161a" stroke="#2d3239" stroke-width="2"/>
    <circle cx="78" cy="80" r="50" fill="#25282e" stroke="#e8a11a" stroke-width="6"/>
    <text class="knob-title" x="150" y="45">UPPER-LEFT</text>
    <text class="knob-text" x="150" y="76">CCW previous chat · press search · CW next chat</text>

    <circle cx="633" cy="80" r="50" fill="#25282e" stroke="#e8a11a" stroke-width="6"/>
    <text class="knob-title" x="705" y="45">UPPER-RIGHT</text>
    <text class="knob-text" x="705" y="76">CCW page up · press command menu · CW page down</text>

    <circle cx="1210" cy="80" r="67" fill="#25282e" stroke="#e8a11a" stroke-width="7"/>
    <circle cx="1184" cy="112" r="5" fill="#d7dde4"/>
    <text class="knob-title" x="1300" y="45">LARGE DIAL</text>
    <text class="knob-text" x="1300" y="76">CCW effort −</text>
    <text class="knob-text" x="1300" y="104">press model · CW effort +</text>
  </g>

  <text x="1600" y="1253" text-anchor="end" style="font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #747b84;">KB16 Codex Desktop v2 · 2026-08-13</text>
</svg>
